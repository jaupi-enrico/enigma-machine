name: Java CI with Maven (JavaFX)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 🔥 Cache Maven (manuale, evita il tuo errore stack overflow)
    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2

    # 🔥 Build senza UI (importantissimo per JavaFX su CI)
    - name: Build with Maven
      run: mvn -B clean package

    # 🔥 (Opzionale) Run test headless
    - name: Run tests (headless)
      run: mvn test
      env:
        DISPLAY: :99

    # 🔥 Dependency graph (lascia pure)
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@v3
